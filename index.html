<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коала с помощью HTML и CSS</title>
    <link rel="stylesheet" href="style.css"> <!-- Подключаем CSS-файл -->
</head>
<body>
    <div class="koala">
        <!-- Тело коалы -->
        <div class="body"></div>

        <!-- Голова коалы -->
        <div class="head"></div>

        <!-- Уши коалы -->
        <div class="ear-left"></div>
        <div class="ear-right"></div>

        <!-- Глаза коалы -->
        <div class="eye-left"></div>
        <div class="eye-right"></div>

        <!-- Нос коалы -->
        <div class="nose"></div>

        <!-- Рот коалы -->
        <div class="mouth"></div>

        <!-- Лапы коалы -->
        <div class="arm-left"></div>
        <div class="arm-right"></div>

        <!-- Хвост коалы -->
        <div class="tail"></div>
    </div>
</body>
</html>
